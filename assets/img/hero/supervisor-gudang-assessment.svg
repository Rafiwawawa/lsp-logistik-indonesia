<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0A192F"/>
    </linearGradient>
    <linearGradient id="accentGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA5329"/>
      <stop offset="100%" stop-color="#FF8A65"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" rx="16" fill="url(#bgGrad1)"/>
  
  <!-- Subtle Grid Lines -->
  <path d="M0 80 H600 M0 160 H600 M0 240 H600 M0 320 H600" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <path d="M120 0 V400 M240 0 V400 M360 0 V400 M480 0 V400" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <!-- Glowing background elements -->
  <circle cx="500" cy="80" r="140" fill="#EA5329" opacity="0.15" filter="blur(30px)"/>
  <circle cx="100" cy="320" r="120" fill="#2563EB" opacity="0.15" filter="blur(30px)"/>

  <!-- Classroom & Assessment Illustration Card -->
  <g filter="url(#shadow)">
    <!-- Room Layout / Desktop -->
    <rect x="40" y="40" width="520" height="320" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    
    <!-- Assessment Session Title Header -->
    <rect x="40" y="40" width="520" height="50" rx="12" fill="rgba(234,83,41,0.2)"/>
    <rect x="40" y="88" width="520" height="2" fill="url(#accentGrad1)"/>
    <text x="70" y="72" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">UJI KOMPETENSI SUPERVISOR GUDANG &amp; DISTRIBUSI</text>
    <rect x="450" y="55" width="90" height="22" rx="11" fill="url(#accentGrad1)"/>
    <text x="495" y="70" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">BNSP LISENSI</text>

    <!-- Assessment Cards Grid inside illustration -->
    <!-- Card A: Teori & SKKNI -->
    <rect x="70" y="110" width="220" height="105" rx="8" fill="rgba(30,41,59,0.8)" stroke="rgba(255,255,255,0.1)"/>
    <circle cx="100" cy="135" r="14" fill="#2563EB"/>
    <text x="100" y="140" fill="#FFF" font-family="sans-serif" font-size="12" text-anchor="middle">📝</text>
    <text x="125" y="135" fill="#38BDF8" font-family="sans-serif" font-size="12" font-weight="bold">1. Uji Teori SKKNI</text>
    <text x="125" y="152" fill="#94A3B8" font-family="sans-serif" font-size="10">Standar 7 Unit Kompetensi</text>
    <rect x="85" y="170" width="190" height="6" rx="3" fill="rgba(255,255,255,0.1)"/>
    <rect x="85" y="170" width="160" height="6" rx="3" fill="#38BDF8"/>
    <text x="85" y="195" fill="#CBD5E1" font-family="sans-serif" font-size="9">✓ Pergudangan &amp; Stock Take</text>

    <!-- Card B: Praktik Pergudangan -->
    <rect x="310" y="110" width="220" height="105" rx="8" fill="rgba(30,41,59,0.8)" stroke="rgba(255,255,255,0.1)"/>
    <circle cx="340" cy="135" r="14" fill="#EA5329"/>
    <text x="340" y="140" fill="#FFF" font-family="sans-serif" font-size="12" text-anchor="middle">📦</text>
    <text x="365" y="135" fill="#FF8A65" font-family="sans-serif" font-size="12" font-weight="bold">2. Uji Praktik Operasional</text>
    <text x="365" y="152" fill="#94A3B8" font-family="sans-serif" font-size="10">Pergudangan &amp; Retur Barang</text>
    <rect x="325" y="170" width="190" height="6" rx="3" fill="rgba(255,255,255,0.1)"/>
    <rect x="325" y="170" width="175" height="6" rx="3" fill="#EA5329"/>
    <text x="325" y="195" fill="#CBD5E1" font-family="sans-serif" font-size="9">✓ Manajemen Rantai Pasok</text>

    <!-- Card C: Wawancara Asesor -->
    <rect x="70" y="230" width="460" height="100" rx="8" fill="rgba(30,41,59,0.8)" stroke="rgba(234,83,41,0.3)"/>
    <circle cx="100" cy="260" r="16" fill="#10B981"/>
    <text x="100" y="265" fill="#FFF" font-family="sans-serif" font-size="14" text-anchor="middle">👨‍💼</text>
    <text x="130" y="258" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="bold">3. Asesmen Wawancara &amp; Verifikasi Portofolio Asesor BNSP</text>
    <text x="130" y="276" fill="#94A3B8" font-family="sans-serif" font-size="11">Penilaian oleh Tim Asesor Berlisensi BNSP Republik Indonesia</text>
    
    <!-- Status Badges -->
    <rect x="130" y="290" width="110" height="22" rx="4" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.4)"/>
    <text x="185" y="305" fill="#34D399" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">✓ LULUS ASSESMEN</text>

    <rect x="250" y="290" width="140" height="22" rx="4" fill="rgba(56,189,248,0.15)" stroke="rgba(56,189,248,0.4)"/>
    <text x="320" y="305" fill="#38BDF8" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">📜 SERTIFIKAT BNSP</text>
  </g>
</svg>
