    <rect x="40" y="40" width="520" height="50" rx="12" fill="rgba(56,189,248,0.15)"/>
    <rect x="40" y="88" width="520" height="2" fill="url(#accentGrad2)"/>
    <text x="70" y="72" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">LOGISTICS ADMINISTRATIVE OFFICER (SKKNI)</text>
    <rect x="440" y="55" width="100" height="22" rx="11" fill="url(#accentGrad2)"/>
    <text x="490" y="70" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">5 UNIT SKKNI</text>

