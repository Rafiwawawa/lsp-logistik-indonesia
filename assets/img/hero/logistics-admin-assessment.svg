    <text x="100" y="140" fill="#FFF" font-family="sans-serif" font-size="12" text-anchor="middle">📋</text>
    <text x="125" y="135" fill="#38BDF8" font-family="sans-serif" font-size="12" font-weight="bold">Dokumentasi Kargo</text>
    <text x="125" y="152" fill="#94A3B8" font-family="sans-serif" font-size="10">Penerimaan &amp; Pengeluaran</text>
    <rect x="85" y="170" width="190" height="6" rx="3" fill="rgba(255,255,255,0.1)"/>
    <rect x="85" y="170" width="170" height="6" rx="3" fill="#38BDF8"/>
    <text x="85" y="195" fill="#CBD5E1" font-family="sans-serif" font-size="9">✓ Verifikasi Catatan Kontainer</text>

    <rect x="310" y="110" width="220" height="105" rx="8" fill="rgba(30,41,59,0.8)" stroke="rgba(255,255,255,0.1)"/>
    <circle cx="340" cy="135" r="14" fill="#6366F1"/>
    <text x="340" y="140" fill="#FFF" font-family="sans-serif" font-size="12" text-anchor="middle">📊</text>
