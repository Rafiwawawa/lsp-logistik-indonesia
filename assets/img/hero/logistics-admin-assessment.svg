    <text x="130" y="276" fill="#94A3B8" font-family="sans-serif" font-size="11">Meningkatkan efisiensi sistem dokumen &amp; rantai pasok industri logistik</text>
    
    <rect x="130" y="290" width="130" height="22" rx="4" fill="rgba(14,165,233,0.15)" stroke="rgba(14,165,233,0.4)"/>
    <text x="195" y="305" fill="#38BDF8" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">✓ KUALIFIKASI NASIONAL</text>
