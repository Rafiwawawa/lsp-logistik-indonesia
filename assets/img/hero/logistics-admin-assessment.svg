    <text x="365" y="152" fill="#94A3B8" font-family="sans-serif" font-size="10">Perhitungan Stok &amp; Laporan</text>
    <rect x="325" y="170" width="190" height="6" rx="3" fill="rgba(255,255,255,0.1)"/>
