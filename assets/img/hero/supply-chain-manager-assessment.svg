    <text x="100" y="265" fill="#FFF" font-family="sans-serif" font-size="14" text-anchor="middle">🎓</text>
    <text x="130" y="258" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="bold">Sertifikat Kompetensi Kerja BNSP P3 ALI</text>
    <text x="130" y="276" fill="#94A3B8" font-family="sans-serif" font-size="11">Diterbitkan oleh LSP Logistik Indonesia terlisensi resmi BNSP</text>
    
    <rect x="130" y="290" width="150" height="22" rx="4" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.4)"/>
    <text x="205" y="305" fill="#34D399" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">✓ LISENSI RESMI BNSP</text>
