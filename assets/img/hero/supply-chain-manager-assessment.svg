    <text x="325" y="195" fill="#CBD5E1" font-family="sans-serif" font-size="9">✓ Mitigasi Risiko Rantai Pasok</text>

    <rect x="70" y="230" width="460" height="100" rx="8" fill="rgba(30,41,59,0.8)" stroke="rgba(16,185,129,0.3)"/>
