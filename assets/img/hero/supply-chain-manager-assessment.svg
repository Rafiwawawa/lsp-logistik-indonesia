<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="600" height="400" rx="16" fill="url(#bgGrad3)"/>
  
  <circle cx="500" cy="80" r="140" fill="#10B981" opacity="0.15" filter="blur(35px)"/>
  <circle cx="100" cy="320" r="120" fill="#6366F1" opacity="0.15" filter="blur(35px)"/>

  <g filter="url(#shadow3)">
    <rect x="40" y="40" width="520" height="320" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(16,185,129,0.3)" stroke-width="1.5"/>
    
    <rect x="40" y="40" width="520" height="50" rx="12" fill="rgba(16,185,129,0.15)"/>
    <rect x="40" y="88" width="520" height="2" fill="url(#accentGrad3)"/>
    <text x="70" y="72" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">SUPPLY CHAIN MANAGER &amp; EXECUTIVE (BNSP)</text>
