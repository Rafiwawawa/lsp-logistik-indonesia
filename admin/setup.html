<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">

  <title>Setup Administrator - LSP Logistik Indonesia</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(16, 85, 180, 0.15), transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(0, 180, 120, 0.1), transparent 50%),
        #0a0e1a;
      color: #fff;
      font-family: "Inter", sans-serif;
    }

    .bg-grid {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 50px 50px;
    }

    .setup-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      padding: 2.5rem;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      backdrop-filter: blur(20px);
      box-shadow: 0 32px 80px rgba(0,0,0,0.5);
    }

    .logo-area {
      margin-bottom: 2rem;
      text-align: center;
    }

    .logo-badge {
      width: 64px;
      height: 64px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #2563eb, #10b981);
      border-radius: 18px;
      font-size: 1.75rem;
    }

    h1 {
      color: #f8fafc;
      font-size: 1.4rem;
      font-weight: 700;
    }

    .subtitle {
      margin-top: 0.25rem;
      color: #94a3b8;
      font-size: 0.875rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      color: #cbd5e1;
      font-size: 0.8125rem;
      font-weight: 500;
    }

    input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      color: #fff;
      font-size: 0.875rem;
      outline: none;
      transition: 0.2s ease;
    }

    input:focus {
      background: rgba(255,255,255,0.09);
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.25);
    }

    .helper-text {
      margin-top: 0.35rem;
      color: #64748b;
      font-size: 0.75rem;
    }

    .btn-submit {
      width: 100%;
      margin-top: 0.5rem;
      padding: 0.875rem;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .btn-submit:hover:not(:disabled) {
      background: linear-gradient(135deg, #1d4ed8, #1e40af);
      transform: translateY(-1px);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .alert {
      display: none;
      margin-bottom: 1.25rem;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      font-size: 0.8125rem;
      line-height: 1.5;
    }

    .alert-error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }

    .alert-success {
      display: block;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #6ee7b7;
    }

    @media (max-width: 520px) {
      .setup-card {
        padding: 2rem 1.5rem;
        border-radius: 18px;
      }
    }
  </style>
</head>

<body>
  <div class="bg-grid"></div>

  <main class="setup-card">
    <div class="logo-area">
      <div class="logo-badge">🛡️</div>
      <h1>Setup Administrator</h1>
      <p class="subtitle">LSP Logistik Indonesia</p>
    </div>

    <div id="alertBox" class="alert" role="alert" aria-live="polite"></div>

    <form id="setupForm" autocomplete="off">
      <div class="form-group">
        <label for="setupToken">Setup Token</label>
        <input
          type="password"
          id="setupToken"
          placeholder="Masukkan token dari .env"
          autocomplete="off"
          required
        >
        <div class="helper-text">
          Token rahasia yang diatur pada environment variable SETUP_TOKEN.
        </div>
      </div>

      <div class="form-group">
        <label for="username">Username Admin</label>
        <input
          type="text"
          id="username"
          placeholder="Contoh: admin"
          autocomplete="username"
          minlength="3"
          maxlength="50"
          required
        >
        <div class="helper-text">
          3–50 karakter: huruf kecil, angka, titik, dan strip.
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password Baru</label>
        <input
          type="password"
          id="password"
          placeholder="Minimal 12 karakter"
          autocomplete="new-password"
          required
        >
        <div class="helper-text">
          Minimal 12 byte dan maksimal 72 byte UTF-8.
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Konfirmasi Password</label>
        <input
          type="password"
          id="confirmPassword"
          placeholder="Ulangi password"
          autocomplete="new-password"
          required
        >
      </div>

      <button type="submit" id="submitBtn" class="btn-submit">
        Daftarkan Administrator
      </button>
    </form>
  </main>

  <script>
    const form = document.getElementById('setupForm');
    const alertBox = document.getElementById('alertBox');
    const submitBtn = document.getElementById('submitBtn');

    function showAlert(message, success = false) {
      const safeMessage =
        typeof message === 'string'
          ? message
          : getErrorMessage(message);

      alertBox.textContent = safeMessage;
      alertBox.className = `alert ${success ? 'alert-success' : 'alert-error'}`;
    }

    function clearAlert() {
      alertBox.textContent = '';
      alertBox.className = 'alert';
    }

    async function parseResponse(response) {
      const text = await response.text();

      if (!text) return {};

      try {
        return JSON.parse(text);
      } catch {
        return { message: text };
      }
    }

    function getErrorMessage(data, fallback = 'Terjadi kesalahan.') {
      if (!data) return fallback;

      if (typeof data === 'string') return data;

      if (typeof data.error === 'string') {
        return data.error;
      }

      if (data.error && typeof data.error === 'object') {
        if (typeof data.error.message === 'string') {
          return data.error.message;
        }

        if (typeof data.error.code === 'string') {
          return data.error.code;
        }
      }

      if (typeof data.message === 'string') {
        return data.message;
      }

      if (data.message && typeof data.message === 'object') {
        if (typeof data.message.message === 'string') {
          return data.message.message;
        }

        try {
          return JSON.stringify(data.message);
        } catch {
          return fallback;
        }
      }

      try {
        return JSON.stringify(data);
      } catch {
        return fallback;
      }
    }

    async function checkSetupStatus() {
      try {
        const response = await fetch('/api/auth/setup-status', {
          credentials: 'same-origin',
        });

        const data = await parseResponse(response);

        if (!response.ok) {
          console.error('[Setup status]', response.status, data);
          return;
        }

        if (data.success && data.data?.setupRequired === false) {
          showAlert(
            'Administrator sudah terdaftar. Setup telah dikunci. Mengalihkan ke login...'
          );

          form.style.display = 'none';

          setTimeout(() => {
            window.location.replace('/admin/login.html');
          }, 1800);
        }
      } catch (error) {
        console.error('[Setup status]', error);
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      clearAlert();

      const setupToken = document.getElementById('setupToken').value.trim();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (!setupToken) {
        showAlert('Setup token wajib diisi.');
        return;
      }

      if (!/^[a-z0-9.-]{3,50}$/.test(username)) {
        showAlert(
          'Username harus 3–50 karakter dan hanya boleh berisi huruf kecil, angka, titik, atau strip.'
        );
        return;
      }

      if (password !== confirmPassword) {
        showAlert('Konfirmasi password tidak cocok.');
        return;
      }

      const passwordBytes = new TextEncoder().encode(password).length;

      if (passwordBytes < 12) {
        showAlert('Password minimal 12 byte UTF-8.');
        return;
      }

      if (passwordBytes > 72) {
        showAlert('Password maksimal 72 byte UTF-8.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Memproses...';

      try {
        const response = await fetch('/api/auth/setup', {
          method: 'POST',
          credentials: 'same-origin',
          headers: {
            'Content-Type': 'application/json',
            'X-Setup-Token': setupToken,
          },
          body: JSON.stringify({
            username,
            password,
          }),
        });

        const data = await parseResponse(response);

        if (!response.ok || !data.success) {
          console.error('[Setup]', response.status, data);

          if (response.status === 429) {
            showAlert(
              'Terlalu banyak percobaan setup. Tunggu beberapa saat sampai rate limit berakhir, lalu coba lagi.'
            );
            return;
          }

          if (response.status === 403) {
            showAlert(
              getErrorMessage(data, 'Setup token tidak valid.')
            );
            return;
          }

          if (response.status === 409) {
            showAlert(
              getErrorMessage(data, 'Administrator sudah pernah dibuat.')
            );
            return;
          }

          showAlert(
            getErrorMessage(
              data,
              `Setup gagal (HTTP ${response.status}).`
            )
          );

          return;
        }

        showAlert(
          'Administrator berhasil didaftarkan. Mengalihkan ke halaman login...',
          true
        );

        form.reset();

        setTimeout(() => {
          window.location.replace('/admin/login.html');
        }, 1500);
      } catch (error) {
        console.error('[Setup request]', error);

        showAlert(
          'Tidak dapat terhubung ke server. Pastikan backend sedang berjalan.'
        );
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Daftarkan Administrator';
      }
    });

    checkSetupStatus();
  </script>
</body>
</html>
