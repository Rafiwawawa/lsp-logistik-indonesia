<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">

  <title>Setup Administrator - LSP Logistik Indonesia</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(16, 85, 180, 0.15), transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(0, 180, 120, 0.1), transparent 50%),
        #0a0e1a;
      color: #fff;
      font-family: "Inter", sans-serif;
    }

    .bg-grid {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 50px 50px;
    }

    .setup-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      padding: 2.5rem;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      backdrop-filter: blur(20px);
      box-shadow: 0 32px 80px rgba(0,0,0,0.5);
    }

    .logo-area {
      margin-bottom: 2rem;
      text-align: center;
    }

    .logo-badge {
      width: 64px;
      height: 64px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #2563eb, #10b981);
      border-radius: 18px;
      font-size: 1.75rem;
    }

    h1 {
      color: #f8fafc;
      font-size: 1.4rem;
      font-weight: 700;
    }

    .subtitle {
      margin-top: 0.25rem;
      color: #94a3b8;
      font-size: 0.875rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      color: #cbd5e1;
      font-size: 0.8125rem;
      font-weight: 500;
    }

    input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      color: #fff;
      font-size: 0.875rem;
      outline: none;
      transition: 0.2s ease;
    }

    input:focus {
      background: rgba(255,255,255,0.09);
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.25);
    }

    .helper-text {
      margin-top: 0.35rem;
      color: #64748b;
      font-size: 0.75rem;
    }

    .btn-submit {
      width: 100%;
      margin-top: 0.5rem;
      padding: 0.875rem;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .btn-submit:hover:not(:disabled) {
      background: linear-gradient(135deg, #1d4ed8, #1e40af);
      transform: translateY(-1px);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .alert {
      display: none;
      margin-bottom: 1.25rem;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      font-size: 0.8125rem;
      line-height: 1.5;
    }

    .alert-error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }

    .alert-success {
      display: block;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #6ee7b7;
    }

    @media (max-width: 520px) {
      .setup-card {
        padding: 2rem 1.5rem;
        border-radius: 18px;
      }
    }
  </style>
</head>

<body>
  <div class="bg-grid"></div>

  <main class="setup-card">
    <div class="logo-area">
      <div class="logo-badge">🛡️</div>
      <h1>Setup Administrator</h1>
      <p class="subtitle">LSP Logistik Indonesia</p>
    </div>

    <div id="alertBox" class="alert" role="alert" aria-live="polite"></div>

    <form id="setupForm" autocomplete="off">
      <div class="form-group">
        <label for="setupToken">Setup Token</label>
        <input
          type="password"
          id="setupToken"
          placeholder="Masukkan token dari .env"
          autocomplete="off"
          required
        >
        <div class="helper-text">
          Token rahasia yang diatur pada environment variable SETUP_TOKEN.
        </div>
      </div>

      <div class="form-group">
        <label for="username">Username Admin</label>
        <input
          type="text"
          id="username"
          placeholder="Contoh: admin"
          autocomplete="username"
          minlength="3"
          maxlength="50"
          required
        >
        <div class="helper-text">
          3–50 karakter: huruf kecil, angka, titik, dan strip.
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password Baru</label>
        <input
          type="password"
          id="password"
          placeholder="Minimal 12 karakter"
          autocomplete="new-password"
          required
        >
        <div class="helper-text">
          Minimal 12 byte dan maksimal 72 byte UTF-8.
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Konfirmasi Password</label>
        <input
          type="password"
          id="confirmPassword"
          placeholder="Ulangi password"
          autocomplete="new-password"
          required
        >
      </div>

      <button type="submit" id="submitBtn" class="btn-submit">
        Daftarkan Administrator
      </button>
    </form>
  </main>

  <script src="/admin/assets/setup.js"></script>
</body>
</html>
