<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - LSP Logistik Indonesia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0e1a;
      background-image:
        radial-gradient(ellipse at 20% 50%, rgba(16, 85, 180, 0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(0, 180, 120, 0.1) 0%, transparent 50%);
      overflow: hidden;
    }

    .bg-grid {
      position: fixed; inset: 0; z-index: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 50px 50px;
    }

    .login-card {
      position: relative; z-index: 1;
      width: 100%; max-width: 440px;
      margin: 1.5rem;
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 3rem 2.5rem;
      box-shadow: 0 32px 80px rgba(0,0,0,0.5);
      animation: slideUp 0.5s ease;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo-area {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .logo-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 72px; height: 72px;
      background: linear-gradient(135deg, #1055b4, #00b478);
      border-radius: 20px;
      margin-bottom: 1rem;
      box-shadow: 0 8px 32px rgba(16, 85, 180, 0.4);
    }

    .logo-badge svg { width: 36px; height: 36px; color: white; }

    .logo-area h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.02em;
    }

    .logo-area p {
      font-size: 0.85rem;
      color: rgba(255,255,255,0.45);
      margin-top: 0.35rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: rgba(255,255,255,0.6);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap svg {
      position: absolute; left: 1rem; top: 50%;
      transform: translateY(-50%);
      width: 18px; height: 18px;
      color: rgba(255,255,255,0.3);
    }

    input[type="password"] {
      width: 100%;
      padding: 0.875rem 1rem 0.875rem 3rem;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      color: #fff;
      font-size: 1rem;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: all 0.2s;
    }

    input[type="password"]:focus {
      border-color: rgba(16, 85, 180, 0.7);
      background: rgba(255,255,255,0.08);
      box-shadow: 0 0 0 3px rgba(16, 85, 180, 0.2);
    }

    .toggle-pw {
      position: absolute; right: 1rem; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      color: rgba(255,255,255,0.35);
      cursor: pointer; padding: 0;
      transition: color 0.2s;
    }
    .toggle-pw:hover { color: rgba(255,255,255,0.7); }
    .toggle-pw svg { width: 18px; height: 18px; }

    .btn-login {
      width: 100%;
      padding: 0.95rem;
      background: linear-gradient(135deg, #1055b4, #1567d4);
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 1rem;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: all 0.25s;
      margin-top: 0.5rem;
      position: relative;
      overflow: hidden;
    }

    .btn-login:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(16, 85, 180, 0.5);
    }

    .btn-login:active { transform: translateY(0); }

    .btn-login:disabled {
      opacity: 0.6; cursor: not-allowed; transform: none;
    }

    .btn-login .spinner {
      display: none;
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .btn-login.loading .btn-text { display: none; }
    .btn-login.loading .spinner { display: block; }

    .error-msg {
      display: none;
      background: rgba(220, 38, 38, 0.15);
      border: 1px solid rgba(220, 38, 38, 0.3);
      border-radius: 10px;
      padding: 0.75rem 1rem;
      color: #fca5a5;
      font-size: 0.85rem;
      text-align: center;
      margin-top: 1rem;
    }

    .error-msg.show { display: block; animation: shake 0.4s ease; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(5px); }
    }

    .footer-note {
      text-align: center;
      margin-top: 2rem;
      font-size: 0.78rem;
      color: rgba(255,255,255,0.2);
    }

    .attempts-warn {
      font-size: 0.78rem;
      color: rgba(250, 200, 80, 0.7);
      text-align: center;
      margin-top: 0.75rem;
      display: none;
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>

  <div class="login-card">
    <div class="logo-area">
      <div class="logo-badge">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
        </svg>
      </div>
      <h1>Panel Admin LSP</h1>
      <p>LSP Logistik Indonesia · Akses Terbatas</p>
    </div>

    <form id="loginForm" autocomplete="off">
      <div class="form-group">
        <label for="password">Password Admin</label>
        <div class="input-wrap">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
          </svg>
          <input type="password" id="password" name="password" placeholder="Masukkan password admin" autocomplete="current-password" required autofocus>
          <button type="button" class="toggle-pw" id="togglePw" title="Tampilkan password">
            <svg id="eyeIcon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-login" id="loginBtn">
        <span class="btn-text">Masuk ke Panel Admin</span>
        <div class="spinner"></div>
      </button>

      <div class="error-msg" id="errorMsg"></div>
      <div class="attempts-warn" id="attemptsWarn"></div>
    </form>

    <p class="footer-note">Session otomatis berakhir setelah 2 jam tidak aktif</p>
  </div>

  <script>
    let failedAttempts = 0;

    // Toggle password visibility
    document.getElementById('togglePw').addEventListener('click', () => {
      const pw = document.getElementById('password');
      pw.type = pw.type === 'password' ? 'text' : 'password';
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('loginBtn');
      const errorMsg = document.getElementById('errorMsg');
      const attemptsWarn = document.getElementById('attemptsWarn');

      // Loading state
      btn.classList.add('loading');
      btn.disabled = true;
      errorMsg.classList.remove('show');

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ password })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          // Success — redirect to dashboard
          window.location.href = '/admin/index.html';
        } else {
          failedAttempts++;
          errorMsg.textContent = data.error || 'Password salah. Silakan coba lagi.';
          errorMsg.classList.add('show');

          if (failedAttempts >= 3) {
            attemptsWarn.style.display = 'block';
            attemptsWarn.textContent = `⚠️ ${failedAttempts} percobaan gagal. Setelah 5 gagal, akses dikunci 15 menit.`;
          }

          // Clear password field
          document.getElementById('password').value = '';
          document.getElementById('password').focus();
        }
      } catch (err) {
        errorMsg.textContent = 'Tidak dapat terhubung ke server. Pastikan server berjalan.';
        errorMsg.classList.add('show');
      } finally {
        btn.classList.remove('loading');
        btn.disabled = false;
      }
    });

    // Check if already logged in
    fetch('/api/auth/me', { credentials: 'include' })
      .then(r => r.json())
      .then(d => { if (d.authenticated) window.location.href = '/admin/index.html'; })
      .catch(() => {});
  </script>
</body>
</html>
