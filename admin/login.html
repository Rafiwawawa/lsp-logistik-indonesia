<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">

  <title>Login Administrator - LSP Logistik Indonesia</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/assets/admin.css">
</head>

<body class="auth-page">
  <div class="auth-background"></div>

  <main class="auth-wrapper">
    <div class="auth-brand">
      <div class="auth-brand-icon">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
            d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
        </svg>
      </div>

      <div>
        <strong>LSP Logistik Indonesia</strong>
        <span>Sistem Administrasi</span>
      </div>
    </div>

    <section class="auth-card">
      <div class="auth-header">
        <div class="auth-header-icon">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
              d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
          </svg>
        </div>

        <h1>Panel Administrator</h1>
        <p>Masuk menggunakan akun administrator LSP Logistik Indonesia.</p>
      </div>

      <form id="loginForm">
        <div class="auth-field">
          <label for="username">Username</label>

          <div class="auth-input-wrap">
            <svg class="auth-input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>

            <input
              type="text"
              id="username"
              name="username"
              placeholder="Masukkan username"
              autocomplete="username"
              minlength="3"
              maxlength="50"
              required
              autofocus
            >
          </div>
        </div>

        <div class="auth-field">
          <label for="password">Password</label>

          <div class="auth-input-wrap">
            <svg class="auth-input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
            </svg>

            <input
              type="password"
              id="password"
              name="password"
              placeholder="Masukkan password"
              autocomplete="current-password"
              required
            >

            <button type="button" id="togglePassword" class="auth-toggle-password"
              aria-label="Tampilkan password" title="Tampilkan password">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" id="loginButton" class="auth-submit">
          <span class="auth-submit-text">Masuk ke Panel Admin</span>
          <span class="auth-spinner"></span>
        </button>

        <div id="loginMessage" class="auth-message" role="alert" aria-live="polite"></div>
      </form>

      <div class="auth-session-note">
        Sesi berakhir setelah 2 jam tidak aktif.
      </div>

      <div class="auth-security-note">
        <span class="auth-security-dot"></span>
        Akses administrator terbatas
      </div>
    </section>

    <p class="auth-footer">LSP Logistik Indonesia</p>
  </main>

  <script src="/admin/assets/login.js"></script>
</body>
</html>
