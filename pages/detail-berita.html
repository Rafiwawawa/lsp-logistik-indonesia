<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Berita & Artikel - LSP LOGISTIK INDONESIA</title>
  <meta name="description" content="Berita dan artikel LSP Logistik Indonesia.">
  <link rel="icon" href="/assets/img/logo-ilcc.jpg">

  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/components/header.css">
  <link rel="stylesheet" href="/assets/css/components/cards.css">
  <link rel="stylesheet" href="/assets/css/components/modal.css">
  <link rel="stylesheet" href="/assets/css/components/footer.css">
  <link rel="stylesheet" href="/assets/css/pages/berita.css">
</head>
<body>
  <header class="site-header" id="mainHeader"></header>

  <main class="section">
    <div class="container news-page-layout">
      <article id="articleContainer">
        <div class="breadcrumb">
          <a href="/">Beranda</a>
          <span class="separator">/</span>
          <a href="/pages/berita.html">Berita & Artikel</a>
          <span class="separator">/</span>
          <span class="current" id="articleBreadcrumb">Detail</span>
        </div>

        <div id="articleLoading" class="card" style="padding:1.5rem;">
          Memuat konten...
        </div>

        <div id="articleContent" style="display:none;">
          <header class="article-header">
            <h1 class="article-title" id="articleTitle"></h1>

            <div class="article-meta" style="display:flex; gap:1rem; align-items:center; flex-wrap:wrap; margin-top:.75rem;">
              <span id="articleDate"></span>
              <span id="articleCategory"></span>
            </div>

            <div style="display:flex; gap:.5rem; margin-top:1rem; flex-wrap:wrap; align-items:center;">
              <button class="btn btn-secondary btn-sm" id="btnShareCopy">🔗 Salin Tautan</button>
              <button class="btn btn-secondary btn-sm" id="btnShareWa"
                style="background:#25D366; color:#FFF; border-color:#25D366;">💬 WhatsApp</button>
            </div>
          </header>

          <img id="articleImage" class="article-featured-image" alt="" style="display:none;">

          <div class="article-body" id="articleBody"
            style="font-size:1rem; line-height:1.8; color:var(--color-text-main);"></div>
        </div>
      </article>

      <aside class="sidebar">
        <div class="widget">
          <h4 class="widget-title">Cari</h4>
          <form action="/pages/berita.html" method="GET" style="display:flex; gap:.5rem;">
            <input type="text" name="q" class="form-control" placeholder="Kata kunci...">
            <button type="submit" class="btn btn-primary">Cari</button>
          </form>
        </div>

        <div class="widget">
          <h4 class="widget-title">Konten Terkait</h4>
          <div id="relatedArticles" style="display:flex; flex-direction:column; gap:.75rem;">
            <span style="font-size:.85rem; color:var(--color-text-muted);">Memuat...</span>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container"></div>
  </footer>

  <div class="modal-backdrop" id="searchModal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title">Pencarian LSP Logistik Indonesia</h3>
        <button class="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="search-modal-field">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
          <input type="text" placeholder="Ketik kata kunci...">
        </div>
      </div>
    </div>
  </div>

  <div class="back-to-top" id="backToTopBtn" title="Kembali ke atas">
    <svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M5 10l7-7m0 0l7 7m-7-7v18"></path>
    </svg>
  </div>

  <script src="/assets/js/components/header.js"></script>
  <script src="/assets/js/components/toast.js"></script>
  <script src="/assets/js/components/search.js"></script>
  <script src="/assets/js/components/modal.js"></script>
  <script src="/assets/js/components/reveal.js"></script>
  <script src="/assets/js/components/footer.js"></script>
  <script src="/assets/js/main.js"></script>

  <script>
    (() => {
      const loading = document.getElementById('articleLoading');
      const content = document.getElementById('articleContent');
      const related = document.getElementById('relatedArticles');

      function formatDate(value) {
        if (!value) return 'Tanggal belum tersedia';

        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return value;

        return new Intl.DateTimeFormat('id-ID', {
          day: '2-digit',
          month: 'long',
          year: 'numeric',
        }).format(date);
      }

      function renderBody(text) {
        const container = document.getElementById('articleBody');
        container.replaceChildren();

        const blocks = String(text || '')
          .split(/\n\s*\n/)
          .map(block => block.trim())
          .filter(Boolean);

        if (!blocks.length) {
          const paragraph = document.createElement('p');
          paragraph.textContent = 'Isi konten belum tersedia.';
          container.appendChild(paragraph);
          return;
        }

        blocks.forEach(block => {
          const paragraph = document.createElement('p');
          const lines = block.split('\n');

          lines.forEach((line, index) => {
            if (index > 0) paragraph.appendChild(document.createElement('br'));
            paragraph.appendChild(document.createTextNode(line));
          });

          container.appendChild(paragraph);
        });
      }

      function showError(message) {
        loading.textContent = message;
        loading.style.display = 'block';
        content.style.display = 'none';
      }

      async function loadRelated(current) {
        try {
          const response = await fetch('/api/berita?limit=6', {
            credentials: 'same-origin',
            cache: 'no-store',
          });

          const data = await response.json();

          if (!response.ok || !Array.isArray(data.data)) {
            throw new Error('Gagal memuat konten terkait.');
          }

          const items = data.data
            .filter(item => item.slug !== current.slug)
            .sort((a, b) => Number(b.kategori === current.kategori) - Number(a.kategori === current.kategori))
            .slice(0, 3);

          if (!items.length) {
            related.innerHTML = '<span style="font-size:.85rem; color:var(--color-text-muted);">Belum ada konten terkait.</span>';
            return;
          }

          related.replaceChildren();

          items.forEach(item => {
            const link = document.createElement('a');
            link.href = `/pages/detail-berita.html?slug=${encodeURIComponent(item.slug)}`;
            link.textContent = `${item.judul} →`;
            link.style.cssText =
              'text-decoration:none; color:var(--color-text-main); font-weight:600; font-size:.85rem;';
            related.appendChild(link);
          });
        } catch (error) {
          console.error('[Related Articles]', error);
          related.textContent = 'Konten terkait belum dapat dimuat.';
        }
      }

      async function loadArticle() {
        const slug = new URLSearchParams(window.location.search).get('slug');

        if (!slug) {
          showError('Konten tidak ditemukan. Silakan kembali ke halaman Berita & Artikel.');
          return;
        }

        try {
          const response = await fetch(`/api/berita/${encodeURIComponent(slug)}`, {
            credentials: 'same-origin',
            cache: 'no-store',
          });

          const data = await response.json();

          if (!response.ok || !data.success || !data.data) {
            throw new Error(data?.error?.message || 'Konten tidak ditemukan.');
          }

          const article = data.data;

          document.title = `${article.judul} - LSP Logistik Indonesia`;
          document.getElementById('articleBreadcrumb').textContent = article.judul;
          document.getElementById('articleTitle').textContent = article.judul;
          document.getElementById('articleDate').textContent =
            `📅 ${formatDate(article.published_at || article.created_at)}`;
          document.getElementById('articleCategory').textContent =
            `🏷️ ${article.kategori}`;

          const image = document.getElementById('articleImage');
          if (article.thumbnail_url) {
            image.src = article.thumbnail_url;
            image.alt = article.judul;
            image.style.display = 'block';
          }

          renderBody(article.isi);

          loading.style.display = 'none';
          content.style.display = 'block';

          document.getElementById('btnShareCopy').addEventListener('click', async () => {
            try {
              await navigator.clipboard.writeText(window.location.href);
              window.showToast?.('Tautan berhasil disalin.', 'success');
            } catch {
              window.showToast?.('Tautan belum dapat disalin.', 'error');
            }
          });

          document.getElementById('btnShareWa').addEventListener('click', () => {
            const text = encodeURIComponent(
              `Baca ${article.kategori.toLowerCase()}: ${article.judul}\n${window.location.href}`
            );
            window.open(`https://wa.me/?text=${text}`, '_blank', 'noopener');
          });

          loadRelated(article);
        } catch (error) {
          console.error('[Article Detail]', error);
          showError(error.message || 'Konten tidak ditemukan.');
        }
      }

      loadArticle();
    })();
  </script>
</body>
</html>
